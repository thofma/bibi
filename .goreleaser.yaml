# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: bibi

before:
  hooks:
    - go run ./tools/release completions

builds:
  - id: bibi
    main: .
    binary: bibi
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - >-
        -s -w
        -X github.com/thofma/bibi/internal/buildinfo.Version={{ .Version }}
        -X github.com/thofma/bibi/internal/buildinfo.Commit={{ .Commit }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64, "386"]
    ignore:
      - goos: darwin
        goarch: "386"

archives:
  - id: bibi
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - src: internal/journals/README.md
        dst: data/journals.md
      - src: .release/completions/*
        dst: completions
        strip_parent: true

checksum:
  algorithm: sha256
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

source:
  enabled: true
  format: tar.gz
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  prefix_template: "{{ .ProjectName }}_{{ .Version }}/"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  footer: |
    Install the latest stable version with Homebrew: `brew install thofma/tap/bibi`.
    Install the archive for your platform or use `go install github.com/thofma/bibi@{{ .Tag }}`.
    Run `bibi --version` to identify your installation.
