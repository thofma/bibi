name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  draft:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate version tag and protect published releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -s LICENSE || { echo 'Choose a project license before packaging releases'; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2> release-state.err; then
            jq -e '.isDraft == true' release-state.json || { echo 'A published release cannot be replaced'; exit 1; }
          elif ! grep -qi 'release not found' release-state.err; then
            cat release-state.err >&2
            exit 1
          fi
          rm -f release-state.json release-state.err
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
      - name: Verify all archives and attach the generated Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          go run ./tools/release formula dist "$(git rev-parse HEAD)"
          test -s dist/bibi.rb
          gh release upload "$RELEASE_TAG" dist/bibi.rb --clobber

  smoke:
    needs: draft
    uses: ./.github/workflows/smoke.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
      commit: ${{ needs.draft.outputs.commit }}

  homebrew-test:
    needs: draft
    uses: ./.github/workflows/homebrew-test.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
      commit: ${{ needs.draft.outputs.commit }}

  publish:
    needs: [draft, smoke, homebrew-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi

  homebrew-publish:
    needs: [draft, publish]
    if: ${{ !contains(needs.draft.outputs.tag, '-') }}
    uses: ./.github/workflows/homebrew-publish.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
    secrets: inherit
