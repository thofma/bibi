name: Run packaged binaries

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        default: ""
      tag:
        type: string
        default: ""
      commit:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: ubuntu-24.04, os: linux, arch: "386" }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: windows-2025, os: windows, arch: amd64 }
          - { runner: windows-11-arm, os: windows, arch: arm64 }
          - { runner: windows-2025, os: windows, arch: "386" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8.0.1
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: dist
      - name: Download the actual draft release assets
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
      - name: Run offline package checks
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            go run ./tools/release smoke dist '${{ matrix.os }}' '${{ matrix.arch }}' "$RELEASE_TAG" "$RELEASE_COMMIT"
          else
            go run ./tools/release smoke dist '${{ matrix.os }}' '${{ matrix.arch }}'
          fi
