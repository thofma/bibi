name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_SSH_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to install in the tap
        required: true
        type: string

concurrency:
  group: homebrew-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download the formula from a published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)' | grep -qx false
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern bibi.rb --dir .release
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$HOMEBREW_TAP_SSH_KEY" || { echo 'Configure HOMEBREW_TAP_SSH_KEY with a write-enabled deploy key for thofma/homebrew-tap'; exit 1; }
          python3 scripts/publish-homebrew.py .release/bibi.rb "$RELEASE_TAG" thofma/homebrew-tap
