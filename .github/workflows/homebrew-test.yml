name: Test Homebrew packages

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      tag:
        type: string
        default: ""
      commit:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Add Linux Homebrew to PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist
      - name: Test Homebrew installation, upgrade and removal
        run: python3 scripts/test-homebrew.py dist
